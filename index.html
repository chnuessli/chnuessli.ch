  <style>
    /* Header refinement kept here intentionally so only index.html changes. */
    .site-header {
      height: 60px;
      justify-content: space-between;
      gap: 24px;
    }
    .brand {
      font-size: 16px;
      font-weight: 500;
      letter-spacing: -.025em;
    }

    .theme-toggle {
      appearance: none;
      width: 54px;
      height: 28px;
      flex: 0 0 auto;
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      justify-items: center;
      padding: 0 3px;
      border: 1px solid var(--hairline);
      border-radius: 999px;
      background: transparent;
      color: var(--fg);
      cursor: pointer;
      transition: border-color .16s ease, opacity .16s ease;
    }
    .theme-toggle::before {
      content: "";
      position: absolute;
      z-index: 0;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--fg);
      transition: transform .2s cubic-bezier(.22,.61,.36,1), background-color .16s ease;
    }
    :root[data-theme="dark"] .theme-toggle::before {
      transform: translateX(26px);
    }
    .theme-icon {
      position: relative;
      z-index: 1;
      width: 13px;
      height: 13px;
      display: block;
      transition: color .16s ease, opacity .16s ease;
    }
    .theme-icon svg {
      width: 100%;
      height: 100%;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.65;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .theme-icon--sun { color: var(--bg); }
    .theme-icon--moon { color: var(--fg); opacity: .7; }
    :root[data-theme="dark"] .theme-icon--sun { color: var(--fg); opacity: .72; }
    :root[data-theme="dark"] .theme-icon--moon { color: var(--bg); opacity: 1; }
    .theme-toggle:hover { opacity: .62; }
    .theme-toggle:focus-visible { outline: 1px solid var(--fg); outline-offset: 4px; }

    /* With the former intro removed, the photographs begin almost directly below the header. */
    .gallery { margin-top: 8px; }

    .site-footer {
      grid-template-columns: 1fr auto;
      gap: 24px;
      min-height: 104px;
      padding-top: 32px;
    }
    .copyright { justify-self: start; color: var(--muted); }
    .menu-button { justify-self: end; }

    @media (max-width: 700px) {
      .site-header { height: 56px; }
      .brand { font-size: 15px; }
      .gallery { margin-top: 4px; }
      .site-footer {
        grid-template-columns: 1fr auto;
        grid-template-areas: "copyright menu";
        min-height: 100px;
        row-gap: 0;
        padding-top: 30px;
      }
      .copyright { grid-area: copyright; align-self: center; }
      .menu-button { grid-area: menu; align-self: center; }
    }
  </style>
</head>

  <script>
    (() => {
      const root = document.documentElement;
      const toggle = document.querySelector('.theme-toggle');
      const themeMeta = document.querySelector('meta[name="theme-color"]');
      if (!toggle) return;

      const syncToggle = () => {
        const isDark = root.dataset.theme === 'dark';
        toggle.setAttribute('aria-pressed', String(isDark));
        toggle.setAttribute('aria-label', isDark ? 'Hellmodus aktivieren' : 'Dunkelmodus aktivieren');
      };

      toggle.addEventListener('click', () => {
        const theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
        root.dataset.theme = theme;
        localStorage.setItem('theme', theme);
        if (themeMeta) themeMeta.content = theme === 'dark' ? '#0d0d0d' : '#ffffff';
        syncToggle();
      });

      syncToggle();
    })();
  </script>
</body>
</html>
